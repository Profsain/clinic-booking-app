services:
  - type: web
    name: clinic-booking-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
